plugins {
    id 'com.android.application'
}

android {
    namespace 'tn.hostn.app'
    compileSdk 34

    defaultConfig {
        applicationId 'tn.hostn.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: '../hostn.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'hostn2024'
            keyAlias System.getenv('KEY_ALIAS') ?: 'hostn'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'hostn2024'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
